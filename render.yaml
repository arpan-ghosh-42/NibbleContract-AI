services:
  - type: web
    name: nibblecontract-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Long documents are chunked into several AI calls, so allow well over gunicorn's 30s default.
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT
    healthCheckPath: /status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
