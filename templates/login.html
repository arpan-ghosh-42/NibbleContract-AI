<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in · {{ brand_a }} {{ brand_b }}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23ea580c'/><text x='50' y='71' font-size='62' font-family='Georgia,serif' font-weight='700' text-anchor='middle' fill='white'>N</text></svg>">
    <script>(function(){var d=document.documentElement,q=new URLSearchParams(location.search),t,m;try{t=q.get('theme')||localStorage.getItem('fpd_theme_v1')}catch(e){t=q.get('theme')}if(t==='light'||t==='dark')d.setAttribute('data-theme',t);m=q.get('motion');if(m!=='on'&&m!=='off')m=(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)?'off':'on';d.setAttribute('data-motion',m)})()</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=12">
</head>
<body class="app-page login-page">
    <header class="topbar">
        <a class="brand" href="/" title="Back to home">
            <div class="brand-logo-icon"><i class="fas fa-shield-halved"></i></div>
            <div>
                <h1>{{ brand_a }} <b>{{ brand_b }}</b></h1>
                <span>{{ tagline }}</span>
            </div>
        </a>
        <div class="topbar-actions">
            <a class="top-link" href="/"><i class="fas fa-house"></i> <span>Home</span></a>
        </div>
    </header>

    <main class="auth-shell">
        <section class="panel auth-card">
            <h2 id="authTitle">Welcome back</h2>
            <p class="auth-sub" id="authSub">Log in to check internship posts and offer letters.</p>

            <div class="auth-tabs" role="tablist" id="authTabs">
                <button class="auth-tab active" type="button" role="tab" data-mode="login" aria-selected="true">Log in</button>
                <button class="auth-tab" type="button" role="tab" data-mode="register" aria-selected="false">Create account</button>
            </div>

            <form id="authForm" novalidate>
                <label class="auth-label" for="authEmail">Email</label>
                <input class="auth-field" id="authEmail" type="email" autocomplete="email" required maxlength="254" placeholder="you@college.edu">

                <div id="passwordBlock">
                    <label class="auth-label" for="authPassword">Password</label>
                    <input class="auth-field" id="authPassword" type="password" autocomplete="current-password" required minlength="8" maxlength="72" placeholder="At least 8 characters">
                </div>

                <div id="confirmBlock" hidden>
                    <label class="auth-label" for="authConfirm">Confirm password</label>
                    <input class="auth-field" id="authConfirm" type="password" autocomplete="new-password" minlength="8" maxlength="72" placeholder="Type it again">
                </div>

                <div class="auth-message" id="authMessage" role="status" aria-live="polite" hidden></div>

                <button class="btn btn-primary auth-submit" id="authSubmit" type="submit">Log in</button>
            </form>

            <div class="auth-links">
                <button class="auth-link" type="button" id="forgotLink">Forgot your password?</button>
                <button class="auth-link" type="button" id="backToLogin" hidden>Back to log in</button>
            </div>
        </section>
        <p class="hint auth-note">We only use your email to sign you in. Your documents are never stored.</p>
    </main>

    <script>window.NC_SUPABASE = {{ {"url": supabase_url, "key": supabase_key} | tojson }};</script>
    {% if auth_enabled %}<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>{% endif %}
    <script src="{{ url_for('static', filename='js/auth.js') }}?v=1"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}?v=1"></script>
</body>
</html>
